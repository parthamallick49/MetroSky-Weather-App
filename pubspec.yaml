name: weather_app
description: "Next-Gen Realistic Weather App in Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking & Serialization
  dio: ^5.4.3+1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local Persistence & Offline Caching
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.3.1

  # Location Services & Radar Mapping
  geolocator: ^12.0.0
  latlong2: ^0.9.1
  maplibre_gl: ^0.16.0

  # Declarative Routing
  go_router: ^14.1.4

  # Visuals, Animations & Charts
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  lucide_icons_flutter: ^4.0.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_ce_generator: ^1.9.2

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/
    - assets/map/

  shaders:
    - assets/shaders/rain_particles.frag
    - assets/shaders/snow_particles.frag
    - assets/shaders/sky_gradient.frag
